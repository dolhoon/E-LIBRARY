<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Area | E-LIBRARY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="member">
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html"><span class="brand-mark">E</span><span>E-LIBRARY</span></a>
      <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
      <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="catalog.html">Catalog</a>
        <a href="member.html">Member Area</a>
        <button class="btn btn-primary" data-logout>Logout</button>
      </nav>
    </div>
  </header>

  <main class="section member-page">
    <div class="container">
      <div class="member-hero">
        <div>
          <p class="eyebrow">Member profile</p>
          <h1>Welcome, <span id="member-name">Reader</span></h1>
        </div>
        <a href="catalog.html" class="btn btn-primary">Search books</a>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><span>Role</span><strong id="member-role">Student</strong></div>
        <div class="stat-card"><span>Institution ID</span><strong id="member-institution">—</strong></div>
        <div class="stat-card"><span>Email</span><strong id="member-email">—</strong></div>
      </div>

      <div class="table-panel">
        <h2>Borrowing history</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Book</th><th>Borrow date</th><th>Due date</th><th>Status</th></tr></thead>
            <tbody id="member-borrowing-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid"><div><a href="index.html" class="brand"><span class="brand-mark">E</span><span>E-LIBRARY</span></a><p>Faculty of Science and Technology</p></div></div>
  </footer>

  <div class="setup-note" data-config-message hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/data-config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/data-layer.js"></script>
  <script src="js/script.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/member.js"></script>
</body>
</html>
